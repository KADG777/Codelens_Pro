name: Codelens Pro CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  DEEPSEEK_API_KEY: ''
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'

jobs:
  check:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
      - name: Install project dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -c requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
      - name: Check source
        run: .\.venv\Scripts\python.exe -m ruff check .
      - name: Verify source distribution and portable runtime
        run: .\.venv\Scripts\python.exe scripts/check_distribution.py
      - name: Reject credentials in source and Git history
        run: .\.venv\Scripts\python.exe scripts/check_secrets.py --history
      - name: Run complete tests without a model API key
        run: .\.venv\Scripts\python.exe -m pytest tests tests_workflow -q --junitxml=reports/tests.xml
      - name: Build source archive
        run: .\.venv\Scripts\python.exe package_release.py --output dist/Codelens_Pro.zip
      - name: Verify archive contents and checksums
        run: .\.venv\Scripts\python.exe scripts/check_distribution.py --archive dist/Codelens_Pro.zip
      - name: Reject credentials in release archive
        run: .\.venv\Scripts\python.exe scripts/check_secrets.py --archive dist/Codelens_Pro.zip
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-python312
          path: reports/tests.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified source archive
        uses: actions/upload-artifact@v7
        with:
          name: Codelens_Pro-source
          path: dist/Codelens_Pro.zip
          if-no-files-found: error
          retention-days: 14
